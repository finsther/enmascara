cases:
  - description: "CLABE in a transfer log"
    input: "SPEI a 002180032240946700 confirmado"
    output: "SPEI a [CLABE] confirmado"
  - description: "CURP after a key"
    input: "curp=GODE561231HDFRRN00"
    output: "curp=[CURP]"
  - description: "RFC next to other fields"
    input: "rfc=GODE561231GR8 regimen=605"
    output: "rfc=[RFC] regimen=605"
  - description: "Card in groups of four next to an expiry date"
    input: "card=4242 4242 4242 4242 exp=12/29"
    output: "card=[CARD] exp=12/29"
  - description: "CLABE and CURP in the same line"
    input: "SPEI a 002180032240946700 de GODE561231HDFRRN00"
    output: "SPEI a [CLABE] de [CURP]"
  - description: "RFC and card inside JSON"
    input: '{"rfc":"COR391215F4A","tarjeta":"378282246310005"}'
    output: '{"rfc":"[RFC]","tarjeta":"[CARD]"}'
  - description: "Two cards in the same line"
    input: "a 4242424242424242 b 5555555555554444"
    output: "a [CARD] b [CARD]"
  - description: "Full-width digits hiding a CLABE"
    input: "clabe=００２１８００３２２４０９４６７００"
    output: "clabe=[CLABE]"
  - description: "Zero-width space inside a CURP"
    input: "curp=GODE561231\u200BHDFRRN00"
    output: "curp=[CURP]"
  - description: "Soft hyphen inside an RFC"
    input: "rfc=GODE\u00AD561231GR8"
    output: "rfc=[RFC]"
  - description: "No-break spaces between card groups"
    input: "pan=4242\u00A04242\u00A04242\u00A04242"
    output: "pan=[CARD]"
  - description: "Dashes between CLABE groups"
    input: "clabe=002-180-03224094670-0"
    output: "clabe=[CLABE]"
  - description: "CURP in lower case"
    input: "curp=gode561231hdfrrn00"
    output: "curp=[CURP]"
  - description: "RFC in lower case"
    input: "rfc=gode561231gr8"
    output: "rfc=[RFC]"
  - description: "CLABE glued to a key with an underscore"
    input: "id_002180032240946700"
    output: "id_[CLABE]"
  - description: "Card followed by two more digits that make an invalid CLABE"
    input: "4242 4242 4242 4242 12"
    output: "[CARD] 12"
  - description: "Digit and space before a CLABE"
    input: "ref 1 002180032240946700"
    output: "ref 1 [CLABE]"
  - description: "Generic RFC for the general public"
    input: "CFDI receptor=XAXX010101000 uso=S01"
    output: "CFDI receptor=XAXX010101000 uso=S01"
  - description: "Generic RFC for foreign residents"
    input: "receptor=XEXX010101000 residencia=USA"
    output: "receptor=XEXX010101000 residencia=USA"
  - description: "IMEI that passes Luhn"
    input: "device imei=490154203237518 os=android"
    output: "device imei=490154203237518 os=android"
  - description: "Snowflake ID that the bank catalog filters"
    input: "message_id=118423949102342144 author=bot"
    output: "message_id=118423949102342144 author=bot"
  - description: "ISBN-13"
    input: "isbn=9780306406157"
    output: "isbn=9780306406157"
  - description: "Text with fewer than six digits"
    input: "hola mundo 12345"
    output: "hola mundo 12345"
  - description: "Empty text"
    input: ""
    output: ""
